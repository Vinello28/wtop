name: Deploy GitHub Pages

# The site source lives in docs/, but it references images from resources/
# (the same screenshot and icon used in README.md) rather than duplicating
# them -- this job stages both into one directory before publishing so the
# repo doesn't carry two copies of the same binary assets.
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "resources/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (docs/ + resources/)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/resources
          cp -r resources/. _site/resources/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
