name: Release

# Push a tag like v0.2.0 to build and publish a GitHub Release with the
# Windows binaries attached. The in-app self-updater (src/updater.rs) picks
# its asset by exact name depending on the architecture it was itself
# compiled for: "wtop.exe" (x86_64) or "wtop-arm64.exe" (aarch64) -- both are
# published bare (unzipped) alongside per-arch zips for manual downloaders.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the single source of truth for the release version -- no
      # need to keep Cargo.toml's [package] version in sync by hand before
      # tagging. This only rewrites the checkout inside this CI job, never
      # commits back, so the tagged commit itself is untouched.
      - name: Sync Cargo.toml version to release tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = ".*"', "version = `"$version`"" | Set-Content Cargo.toml -NoNewline
          Write-Host "Cargo.toml version set to $version (from tag ${{ github.ref_name }})"

      - name: Install GNU-host Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
        shell: bash

      # release: false reuses the MSYS2 install that's already baked into the
      # windows-latest runner image, rather than extracting a fresh copy on
      # top of it (release: true's default) -- that extract-over-existing
      # pattern is what left gcc.exe missing before. We don't assume WHERE
      # that install lives; we read it back from the action's own
      # msys2-location output in the next step instead.
      - name: Set up MSYS2 UCRT64 (GCC toolchain)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          release: false
          update: true

      # .cargo/config.toml hardcodes an absolute linker path for local dev
      # convenience, but CI can't assume that path is correct -- rewrite it
      # (CI checkout only, never committed) to wherever MSYS2 actually
      # landed, and fail fast with a clear message if gcc genuinely isn't
      # there instead of surfacing a confusing error deep in some
      # dependency's build script.
      - name: Point cargo at the resolved MSYS2 GCC toolchain
        shell: pwsh
        run: |
          $root = "${{ steps.msys2.outputs.msys2-location }}"
          $gcc = Join-Path $root "ucrt64\bin\gcc.exe"
          $ar = Join-Path $root "ucrt64\bin\ar.exe"
          if (-not (Test-Path $gcc)) {
            Write-Error "gcc.exe not found at $gcc after MSYS2 setup (msys2-location='$root'). The mingw-w64-ucrt-x86_64-gcc package install likely failed."
            exit 1
          }
          @"
          [target.x86_64-pc-windows-gnu]
          linker = '$gcc'
          ar = '$ar'
          "@ | Set-Content .cargo/config.toml -NoNewline
          Write-Host "Resolved MSYS2 root: $root"
          Write-Host "Linker: $gcc"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-x64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release
        shell: bash

      # This is a GNU-*host* build (not an MSVC host cross-compiling to a
      # GNU target), so the output has no target-triple subdirectory --
      # it's directly at target/release/wtop.exe.
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/wtop.exe dist/wtop.exe
          Compress-Archive -Path target/release/wtop.exe -DestinationPath "dist/wtop-${{ github.ref_name }}-x86_64-pc-windows-gnu.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-x64
          path: dist/*
          retention-days: 1

  build-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml version to release tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = ".*"', "version = `"$version`"" | Set-Content Cargo.toml -NoNewline
          Write-Host "Cargo.toml version set to $version (from tag ${{ github.ref_name }})"

      # Native ARM64 Windows build: unlike the x64 job, this targets MSVC
      # (there's no MSYS2/mingw-w64 toolchain for aarch64-pc-windows-*), so
      # it does NOT reuse .cargo/config.toml's GCC linker override -- that
      # section is scoped to [target.x86_64-pc-windows-gnu] only and is
      # inert here.
      - name: Install MSVC-host Rust toolchain with the ARM64 target
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc
        shell: bash

      # Cross-linking to ARM64 needs the matching MSVC lib/include paths on
      # PATH/LIB/INCLUDE, which the default x64 dev environment doesn't set
      # up by itself. `arch: amd64_arm64` (not bare "arm64") is the
      # cross-compilation form: host=amd64/x64, target=arm64 -- plain "arm64"
      # asks vcvarsall for a *native* ARM64 toolchain, which doesn't exist on
      # this x64 runner, so it fails to wire up PATH/LIB/INCLUDE and the
      # build silently falls back to whatever link.exe was already on PATH
      # (Git for Windows' coreutils `link`, not MSVC's linker).
      - name: Set up MSVC ARM64 cross-compilation environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # shell: pwsh, not bash -- GitHub's Windows runner's `bash` is Git for
      # Windows' Git Bash, which prepends its own C:\Program Files\Git\usr\bin
      # to PATH on startup. That directory ships a GNU coreutils `link`
      # (hardlink creation), and it shadows MSVC's real link.exe ahead of the
      # paths ilammy/msvc-dev-cmd just set up, so the linker silently becomes
      # the wrong `link` and fails with a "extra operand" usage error.
      - name: Build release binary
        run: cargo build --release --target aarch64-pc-windows-msvc
        shell: pwsh
        # NOTE: unverified in CI as of this writing -- this is the first
        # ARM64 build of this project. rustls' `ring` crypto backend is the
        # main risk (it needs working aarch64-pc-windows-msvc assembly
        # support); if this step fails on `ring`, the fix is switching
        # ureq's TLS feature from "rustls" to "native-tls" in Cargo.toml
        # (uses Windows' built-in schannel, no external crypto build step).

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/aarch64-pc-windows-msvc/release/wtop.exe dist/wtop-arm64.exe
          Compress-Archive -Path target/aarch64-pc-windows-msvc/release/wtop.exe -DestinationPath "dist/wtop-${{ github.ref_name }}-aarch64-pc-windows-msvc.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-arm64
          path: dist/*
          retention-days: 1

  publish:
    needs: [build-x64, build-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
